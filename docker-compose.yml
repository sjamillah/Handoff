services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-handoff}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-handoff}
      POSTGRES_DB: ${POSTGRES_DB:-handoff}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      target: runtime
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-handoff}:${POSTGRES_PASSWORD:-handoff}@db:5432/${POSTGRES_DB:-handoff}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123}
      SEED_OPERATOR_PASSWORD: ${SEED_OPERATOR_PASSWORD:-ops123}
      SEED_CLIENT_PASSWORD: ${SEED_CLIENT_PASSWORD:-client123}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-false}
      APP_TIMEZONE: ${APP_TIMEZONE:-Africa/Kigali}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8000}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head
      && python -m app.seed
      && python -m app.import_episodes seed/episodes.csv
      && uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "3000:80"

  tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: dev
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-handoff}:${POSTGRES_PASSWORD:-handoff}@db:5432/handoff_test
      SEED_ADMIN_PASSWORD: admin123
      SEED_OPERATOR_PASSWORD: ops123
      SEED_CLIENT_PASSWORD: client123
      APP_TIMEZONE: Africa/Kigali
    depends_on:
      db:
        condition: service_healthy
    command: pytest

volumes:
  pgdata:
