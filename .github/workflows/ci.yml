name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Lint
        run: docker compose run --rm --build --no-deps tests sh -c "ruff format --check . && ruff check ."

      - name: Tests against PostgreSQL
        run: docker compose run --rm tests

      - name: Stop containers
        if: always()
        run: docker compose down -v

  frontend:
    name: Frontend type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build
